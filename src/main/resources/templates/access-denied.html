<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 권한 없음 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card border-0 shadow-sm p-5 text-center">
        <h1 class="fw-bold text-danger mb-3">403 Forbidden</h1>
        <p class="text-muted mb-4">이 페이지에 접근할 권한이 없습니다.</p>
        <a th:href="@{/products}" class="btn btn-primary">상품 목록으로 이동</a>
    </div>
</div>

<div class="container text-center text-muted small mt-4 mb-3">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + '  │  학번: 2171095  │  성명: 신한석'}"></p>
</div>

</body>
</html>
