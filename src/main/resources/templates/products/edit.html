<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h4 class="fw-bold mb-4">상품 수정</h4>

    <form th:action="@{/products/{id}/edit(id=${productId})}"
          th:object="${productDto}"
          method="post"
          class="card border-0 shadow-sm p-4">

        <div class="mb-3">
            <label class="form-label">상품명</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">가격</label>
            <input type="number" th:field="*{price}" class="form-control" min="0" required>
        </div>

        <div class="mb-3">
            <label class="form-label">재고</label>
            <input type="number" th:field="*{stock}" class="form-control" min="0" required>
        </div>

        <div class="mb-4">
            <label class="form-label">설명</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">수정</button>
            <a th:href="@{/products}" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>
</div>

<div class="container text-center text-muted small mt-4 mb-3">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + '  │  학번: 2171095  │  성명: 신한석'}"></p>
</div>

</body>
</html>
