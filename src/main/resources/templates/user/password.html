<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h4 class="fw-bold mb-4">비밀번호 변경</h4>

    <form th:action="@{/user/password}"
          th:object="${passwordChangeDto}"
          method="post"
          class="card border-0 shadow-sm p-4">

        <div class="mb-3">
            <label class="form-label">현재 비밀번호</label>
            <input type="password" th:field="*{currentPassword}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">새 비밀번호</label>
            <input type="password" th:field="*{newPassword}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control">
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primsary">변경</button>
            <a th:href="@{/home}" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>
</div>

<div class="container text-center text-muted small mt-4 mb-3">
    <p th:text="${'실습 수행 일시: ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (E) a hh:mm:ss') + '  │  학번: 2171095  │  성명: 신한석'}"></p>
</div>

</body>
</html>
